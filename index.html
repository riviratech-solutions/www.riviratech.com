<!doctype html>
<html lang="en" class="booting">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Site loader (/js/neuralbrain.js + /css/loader.css). The inline rule paints
       the dark loader background on the very first frame, before any file has
       loaded, so a first visit never flashes a blank white page. -->
  
  <link rel="stylesheet" href="/css/loader.css" />
  <meta name="theme-color" content="#212529" />
  <!-- The site ships its own light-and-dark design. Declaring the scheme stops
       Chrome "Auto Dark Mode" from re-inverting it — which otherwise turns the
       dark hero's white headings and copy dark (e.g. "Explore" on /courses). -->
  <meta name="color-scheme" content="light" />
  <!-- color-scheme alone does NOT stop the Dark Reader browser extension, which
       ignores it and inverts text anyway — turning the dark hero's white title
       ("Our gallery") and copy near-black (gallery/events/careers/certificate
       pages). This lock tells Dark Reader to leave the site to its own theming. -->
  <meta name="darkreader-lock" />

  <!-- Favicon: the Rivira Tech R/V mark (blue + silver reads on light and dark tab bars).
       PNG for modern browsers, .ico as the legacy fallback. -->
  <link rel="icon" type="image/png" href="/images/rivira-favicon.png" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />

  <base href="/" />


  <!-- Static SEO / social tags. This is a client-rendered SPA, so link-preview
       scrapers (Facebook, LinkedIn, Discord, iMessage) read THIS markup, not the
       React <Head> tags. URLs must be absolute. The React Head component updates
       the per-route title/description for JS clients. -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rivira Technologies — Digital Growth Made Simple | AI, Cloud & Enterprise Solutions</title>
  <meta name="description"
    content="Rivira Technologies helps businesses and professionals scale with AI innovations, enterprise digital strategy, cutting-edge training, and high-velocity product engineering." />
  <!-- No static canonical here: the per-route <Head> (src/components/Includes.tsx)
       emits a route-correct canonical. A hardcoded homepage canonical here made
       EVERY route report two canonicals, one of them wrong (audit finding). -->

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Rivira Technologies" />
  <meta property="og:title" content="Rivira Technologies — Digital Growth Made Simple | AI, Cloud & Enterprise Solutions" />
  <meta property="og:description"
    content="Learn Generative AI, build real projects, and ship production-ready AI proof-of-concepts." />
  <meta property="og:url" content="https://www.riviratech.com/" />
  <meta property="og:image" content="https://www.riviratech.com/images/rivira-logo-512.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Rivira Technologies — Digital Growth Made Simple | AI, Cloud & Enterprise Solutions" />
  <meta name="twitter:description"
    content="Learn Generative AI, build real projects, and ship production-ready AI proof-of-concepts." />
  <meta name="twitter:image" content="https://www.riviratech.com/images/rivira-logo-512.png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="js/jquery.min.js" type="text/javascript" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- RiviraTech Typography: Plus Jakarta Sans & Inter Tight -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

  <link href="css/wow.css" rel="stylesheet" />
  <script src="js/wow.js" type="text/javascript" defer></script>
  <script src="js/krousel.js" type="text/javascript" defer></script>
  <link rel="stylesheet" href="css/krousel.css" />

  <!-- Brand fonts (IBM Plex Sans / Source Sans 3), declared in css/website.css -->
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Website stylesheet: every public page's CSS in one file. Plugin CSS (wow,
       phoneinput, lightgallery) stays separate. The admin panel does not use it:
       on panel routes (sign in included) it is removed and css/panel-base.css + css/panel.css are
       loaded instead (below, and in App.tsx on client-side navigation). -->
    <link rel="stylesheet" id="website-css" href="css/website.css" />
  <!-- Rivira modern design system (header, footer, pages); after website.css so it wins -->
  <link rel="stylesheet" id="rivira-design-css" href="/css/rivira-design.css" />
  <script>
    (function () {
      var p = location.pathname.toLowerCase().replace(/\/$/, "");
      if (p === "/signin" || p === "/logout" || p === "/dashboard" || p.indexOf("/panel") === 0) {
        // panel pages (sign in included) never load the website stylesheets
        ["website-css", "rivira-design-css"].forEach(function (id) {
          var site = document.getElementById(id);
          if (site) site.parentNode.removeChild(site);
        });
        [["panel-base-css", "/css/panel-base.css"], ["panel-css-bundle", "/css/panel.css"]].forEach(function (s) {
          var link = document.createElement("link");
          link.id = s[0];
          link.rel = "stylesheet";
          link.href = s[1];
          document.head.appendChild(link);
        });
      }
    })();
  </script>

</head>

<body class="rt-home">
  <!-- Site loader: animated by /js/neuralbrain.js as soon as it is parsed; the
       app calls RTLoader.ready() once mounted and the loader fades out after
       at least data-min-ms milliseconds on screen. -->
  <div id="rt-loader" role="status" aria-label="Loading Rivira Tech" data-min-ms="2200">
    <div class="kl-box">
      <canvas class="kl-brain" aria-hidden="true"></canvas>
      <div class="kl-brand" aria-hidden="true">
        <div class="kl-main"><span class="kl-mark"></span><span class="kl-genai" data-text="RIVIRA">RIVIRA</span></div>
        <div class="kl-sub"><span class="kl-line left"></span><span class="kl-sub-text">TECH</span><span class="kl-line right"></span></div>
      </div>
    </div>
  </div>
  <script src="/js/neuralbrain.js"></script>

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>

  <script>
    window.onload = function () {
      // Scroll to top when a React Router link is clicked
      $(document)
        .find('[data-discover="true"]').on("click", function () {
          window.scrollTo(0, 0);
        })
    };
  </script>


  <script src="js/cursorfx.js"></script>
  <script>
    CursorFX.init();                          // rotates per session

    CursorFX.init({                           // or steer it
      types: ['dot-ring', 'trail'], // pool to draw from
      rotate: 'session',                     // session | random | fixed
      color: '#8B5CF6',
      size: 40,
      hideNative: false
    });

    CursorFX.setType('glow');                 // swap live
    CursorFX.newSession();                    // re-draw from the pool
    //CursorFX.register('name', { build: fn }); // add your own
  </script>


</body>

</html>
